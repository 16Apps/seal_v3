<div class="col-xxl-12 col-sm-12 col-12 p-3 rounded-3" style="background-color: #444957;">
  <h5 class="card-title">{{$ctrl.titulo}}</h5>
  <p class="small text-muted mb-2 grafico-loc-trilha" ng-if="$ctrl.localizacaoTrilha">
    <i class="bi bi-geo-alt me-1" aria-hidden="true"></i>
    <span class="grafico-loc-trilha-text">{{$ctrl.localizacaoTrilha}}</span>
  </p>
  <div class="grafico-kpi-card">
    <p class="small text-danger mb-2" ng-if="$ctrl.erro">{{$ctrl.erro}}</p>
    <div class="grafico-kpi-chart-area position-relative" style="min-height: 380px">
      <p class="small text-muted mb-2" ng-if="$ctrl.carregando">Carregando…</p>
      <div
        class="grafico-kpi-empty-state position-absolute top-0 start-0 w-100 d-flex align-items-center justify-content-center"
        style="min-height: 380px; z-index: 1"
        ng-if="!$ctrl.carregando && !$ctrl.erro && !$ctrl.chartGroups.length">
        <p class="small text-muted mb-0 text-center">Nenhum dado para exibir.</p>
      </div>
      <div
        class="d-flex flex-wrap align-items-start justify-content-start gap-3 pizza-kpi-row w-100"
        ng-show="$ctrl.chartGroups.length">
        <div
          class="pizza-kpi-col flex-grow-1"
          ng-repeat="grupo in $ctrl.chartGroups track by $index"
          style="min-width: 260px; max-width: 420px;">
          <h6 class="text-center mb-1 small text-muted" ng-if="grupo.titulo">{{grupo.titulo}}</h6>
          <p class="text-center mb-2 small text-secondary px-1" ng-if="grupo.subtitulo">{{grupo.subtitulo}}</p>
          <div
            class="grafico-kpi-mount pizza-kpi-chart-slot"
            style="min-height: 320px">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
